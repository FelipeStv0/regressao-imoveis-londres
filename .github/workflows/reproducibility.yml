name: Reprodutibilidade e benchmark de ML

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portfolio-ml:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LONDON_DATA_DIR: data
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Python limpo
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Compilação sintática
        run: python -m compileall -q scripts tests
      - name: Testes offline de integridade, vazamento e métricas
        run: python -m pytest -q tests
      - name: Obter dataset pela API oficial
        run: python scripts/prepare_data.py --download --dir data
      - name: Registrar versões de dependências
        run: |
          mkdir -p artifacts/benchmark
          python -m pip freeze > artifacts/benchmark/dependencias_instaladas.txt
      - name: Executar notebook acadêmico do início ao fim
        run: |
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=600 \
            --output executed.ipynb --output-dir artifacts \
            Regressao_Londres_Codigo.ipynb
      - name: Verificar métricas do notebook original
        run: python scripts/check_results.py artifacts/metricas_teste.csv
      - name: Benchmark temporal e geográfico, interpretação e figuras
        run: python scripts/run_benchmark.py --dir data --output artifacts/benchmark
      - name: Verificar contrato dos artefatos do benchmark
        run: python scripts/check_benchmark.py artifacts/benchmark
      - name: Publicar notebook, dados derivados e resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducibilidade-completa
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
